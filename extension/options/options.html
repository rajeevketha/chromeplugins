<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SF Dev Toolkit — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <img src="../icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1>SF Dev Toolkit</h1>
        <p>Settings for your Salesforce day-to-day helper.</p>
      </div>
    </header>

    <section class="card">
      <h2>On-page helpers</h2>
      <label class="check">
        <input type="checkbox" id="showBadge" />
        Show environment badge (Sandbox / Production)
      </label>
      <label class="check">
        <input type="checkbox" id="showToolbar" />
        Show floating quick-nav toolbar on Salesforce pages
      </label>
    </section>

    <section class="card">
      <h2>API</h2>
      <label for="apiVersion">Default API version</label>
      <select id="apiVersion"></select>
    </section>

    <section class="card">
      <h2>Favorites</h2>
      <p class="muted">Stored in Chrome sync storage (max ~50).</p>
      <button type="button" id="clearFavs" class="btn danger">Clear all favorites</button>
    </section>

    <p id="status" class="status" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
