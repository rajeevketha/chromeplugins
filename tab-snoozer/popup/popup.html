<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Snoozer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <h1>Tab Snoozer</h1>
          <p>Park a tab. Get it back later.</p>
        </div>
        <span id="count" class="pill">0</span>
      </header>

      <section class="block">
        <div class="presets">
          <button type="button" class="chip" data-preset="1m">1m</button>
          <button type="button" class="chip" data-preset="15m">15m</button>
          <button type="button" class="chip" data-preset="30m">30m</button>
          <button type="button" class="chip" data-preset="1h">1h</button>
          <button type="button" class="chip" data-preset="2h">2h</button>
          <button type="button" class="chip" data-preset="tonight">Tonight</button>
          <button type="button" class="chip" data-preset="tomorrow">Tomorrow</button>
        </div>

        <div class="custom">
          <p class="custom-label">Custom time</p>
          <input id="hours" type="number" min="0" max="720" value="0" aria-label="Hours" />
          <span>h</span>
          <input id="minutes" type="number" min="0" max="59" value="15" aria-label="Minutes" />
          <span>m</span>
          <button type="button" id="customSnooze" class="go">Snooze</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="block list-block">
        <div class="row-head">
          <h2>Snoozed tabs</h2>
          <button type="button" id="clearAll" class="text-btn hidden">Clear all</button>
        </div>
        <ul id="list" class="queue"></ul>
        <p id="empty" class="empty">No snoozed tabs yet</p>
      </section>

      <section class="block prefs">
        <label class="pref">
          <span>
            <strong>Auto-open when due</strong>
            <small>Off = notify first (recommended)</small>
          </span>
          <input id="autoOpenOnDue" type="checkbox" class="switch" />
        </label>
        <label class="pref">
          <span>
            <strong>Page side tab</strong>
            <small>Quick Snooze on websites</small>
          </span>
          <input id="showPageLauncher" type="checkbox" class="switch" />
        </label>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
